name: build-dev

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

          cp build/esp32-remote.bin remote-${GITHUB_REF_NAME}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: remote-*.bin